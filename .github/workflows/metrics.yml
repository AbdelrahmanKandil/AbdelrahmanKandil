name: Generate metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Overview (public and private)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AbdelrahmanKandil
          template: classic
          filename: metrics/overview.svg
          base: header, repositories
          config_timezone: Africa/Cairo
          committer_message: "chore: update metrics overview [skip ci]"

      - name: Languages (public and private)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AbdelrahmanKandil
          template: classic
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          config_timezone: Africa/Cairo
          committer_message: "chore: update metrics languages [skip ci]"
